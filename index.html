<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page metadata -->
    <meta charset="UTF-8">
    <title>Input Types Example</title>
</head>

<body>

    <!-- ================= Text Inputs ================= -->

    <!-- Email text input -->
    <input type="text" placeholder="Email">
    <br><br>

    <!-- Password input -->
    <input type="password" placeholder="Password">
    <br><br>

    <!-- ================= Button ================= -->

    <!-- Button input -->
    <input type="button" value="Login">
    <br><br>

    <!-- ================= Checkbox ================= -->

    <!-- Checkbox input -->
    <input type="checkbox"> Remember me
    <br><br>

    <!-- ================= Color Picker ================= -->

    <!-- Color input -->
    <input type="color">
    <br><br>

    <!-- ================= Date & Time Inputs ================= -->

    <!-- Date input -->
    <input type="date">
    <br><br>

    <!-- Date and time input -->
    <input type="datetime-local">
    <br><br>

    <!-- ================= Email Input ================= -->

    <!-- Email validation input -->
    <input type="email" placeholder="Enter email">
    <br><br>

    <!-- ================= File Upload ================= -->

    <!-- File input -->
    <input type="file">
    <br><br>

    <!-- ================= Month Input ================= -->

    <!-- Month input (fixed extra space error) -->
    <input type="month">
    <br><br>

    <!-- ================= Number Input ================= -->

    <!-- Number input -->
    <input type="number">
    <br><br>

    <!-- ================= Radio Button ================= -->

    <!-- Radio button (name is required for grouping) -->
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br><br>

    <!-- ================= Range Slider ================= -->

    <!-- Range input -->
    <input type="range">
    <br><br>

    <!-- ================= Week Input ================= -->

    <!-- Week input -->
    <input type="week">

</body>
</html>
